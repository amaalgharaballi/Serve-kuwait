name: Deploy to Netlify

# main -> servekuwait.com, then a message in Slack #deploys.
# Pull request previews come from Netlify's own GitHub integration.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETIFLY }}
      NETLIFY_SITE_ID: 5da4e14d-210d-4b2c-b91c-df484e7abf2c
    steps:
      - name: Check the Netlify key is set
        id: key
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "NETLIFY_AUTH_TOKEN secret is not set yet, skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.key.outputs.ok == 'true'
        with:
          node-version: 20

      - name: Deploy live (main)
        if: steps.key.outputs.ok == 'true' && github.event_name == 'push'
        run: npx -y netlify-cli@17 deploy --prod --dir public --message "${{ github.sha }}"

      - name: Tell Slack
        if: always() && github.event_name == 'push' && steps.key.outputs.ok == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESULT: ${{ job.status }}
          MSG: ${{ github.event.head_commit.message }}
          WHO: ${{ github.actor }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && { echo "No SLACK_WEBHOOK_URL secret, skipping."; exit 0; }
          TITLE=$(printf '%s' "$MSG" | head -1)
          if [ "$RESULT" = "success" ]; then
            TEXT=":white_check_mark: *Live on servekuwait.com*: ${TITLE} (by ${WHO})"
          else
            TEXT=":x: *Deploy failed*: ${TITLE} (by ${WHO}). Site unchanged. <${RUN}|See what went wrong>"
          fi
          node -e 'process.stdout.write(JSON.stringify({text: process.argv[1]}))' "$TEXT" | curl -sS -X POST -H 'content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"
